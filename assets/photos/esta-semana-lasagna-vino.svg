<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Especial semanal: lasaña con vino tinto</title>
  <desc id="desc">Ilustración cálida y oscura de una porción de lasaña servida con una copa de vino tinto.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14100e" />
      <stop offset="100%" stop-color="#261b16" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="rgba(146, 176, 135, 0.35)" />
      <stop offset="100%" stop-color="rgba(20, 16, 14, 0)" />
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31241c" />
      <stop offset="100%" stop-color="#231912" />
    </linearGradient>
    <linearGradient id="lasagnaTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c88c" />
      <stop offset="100%" stop-color="#f0a85e" />
    </linearGradient>
    <linearGradient id="lasagnaMiddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2431f" />
      <stop offset="100%" stop-color="#7a1f0a" />
    </linearGradient>
    <linearGradient id="wine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c1f3b" />
      <stop offset="100%" stop-color="#601024" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="rgba(0,0,0,0.45)" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g transform="translate(140 110)" filter="url(#shadow)">
    <rect width="920" height="580" rx="48" fill="url(#card)" />
    <rect width="920" height="580" rx="48" fill="url(#cardGlow)" />
    <g transform="translate(80 120)" fill="#ead7c0">
      <text font-family="'Alegreya', 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="0.12em">ESTA SEMANA</text>
      <text y="90" font-family="'Alegreya', 'Times New Roman', serif" font-size="108" font-weight="700">Lasaña al horno</text>
      <text y="170" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-size="40" font-weight="400">Salsa boloñesa lenta, queso gratinado y hierbas de la casa.</text>
      <text y="230" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-size="36" font-weight="400">Acompañada de copa de vino tinto reserva.</text>
      <text y="320" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-size="44" font-weight="600">Combo especial · ₡5.500</text>
    </g>
    <g transform="translate(620 140)">
