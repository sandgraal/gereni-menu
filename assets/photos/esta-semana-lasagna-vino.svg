        <path d="M200 0 L220 0 L220 220 C220 260 190 296 162 324 C158 296 152 260 152 220 L152 0" fill="url(#wine)" />
        <path d="M80 0 C80 -30 220 -30 220 0 C220 30 80 30 80 0 Z" fill="#d6ccc4" />
        <path d="M128 340 C138 360 182 360 192 340" stroke="#ead7c0" stroke-width="10" stroke-linecap="round" fill="none" />
      </g>
      <g transform="translate(-40 200)">
        <path d="M0 0 H320 L300 120 C296 138 280 150 262 150 H58 C40 150 24 138 20 120 Z" fill="#2d211b" opacity="0.85" />
        <path d="M24 18 H296 L284 100 C282 112 270 120 256 120 H64 C50 120 38 112 36 100 Z" fill="#8c4a1f" />
        <path d="M32 30 H288 C280 70 240 92 214 104 C188 116 148 128 114 120 C80 112 48 86 32 30 Z" fill="url(#lasagnaTop)" />
        <path d="M32 92 H288 C280 124 238 150 208 156 C182 162 146 166 116 156 C86 146 44 124 32 92 Z" fill="url(#lasagnaMiddle)" />
        <path d="M40 126 H280 C260 142 222 154 192 156 C152 160 92 154 40 126 Z" fill="#f2c979" />
