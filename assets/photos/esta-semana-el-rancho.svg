<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Especial de la semana en El Rancho</title>
  <desc id="desc">Tarjeta promocional para destacar el especial semanal del restaurante Gereni.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d140f" />
      <stop offset="100%" stop-color="#2b1d14" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c47a35" />
      <stop offset="100%" stop-color="#a35b1f" />
    </linearGradient>
    <clipPath id="card-radius">
      <rect x="80" y="80" width="1040" height="640" rx="56" ry="56" />
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="rgba(0,0,0,0.35)" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g filter="url(#shadow)" clip-path="url(#card-radius)">
    <rect x="80" y="80" width="1040" height="640" fill="url(#card)" />
    <g transform="translate(160 170)" fill="#f6efe7">
      <text font-family="'Alegreya', 'Times New Roman', serif" font-weight="700" font-size="72" letter-spacing="0.06em">ESTA SEMANA EN EL RANCHO</text>
      <text y="120" font-family="'Alegreya', 'Times New Roman', serif" font-weight="700" font-size="112">Entraña a la Parrilla</text>
      <text y="210" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-weight="400" font-size="42" xml:space="preserve">Marinada en café de Turrialba y terminada con chimichurri de culantro.</text>
      <text y="270" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-weight="400" font-size="42">Servida con papas rústicas y vegetales ahumados.</text>
      <text y="370" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-weight="600" font-size="48">Disponible hasta el domingo · ₡18&nbsp;900</text>
    </g>
    <g transform="translate(720 360)">
      <circle cx="0" cy="0" r="200" fill="rgba(0,0,0,0.12)" />
      <circle cx="-12" cy="-16" r="188" fill="#592b16" />
      <path d="M -112 -40 C -80 -120 32 -140 88 -96 C 164 -36 124 44 52 80 C -12 112 -132 68 -112 -40 Z" fill="#f1d7a3" />
      <path d="M -72 -12 C -30 -64 48 -80 92 -38 C 124 -8 112 44 62 70 C 12 96 -90 46 -72 -12 Z" fill="#b44d1a" />
      <path d="M -118 78 C -84 114 -12 146 46 140 C 110 132 148 84 128 42 C 108 0 30 -20 -38 4 C -82 20 -110 42 -118 78 Z" fill="#f6efe7" opacity="0.75" />
    </g>
  </g>
</svg>
