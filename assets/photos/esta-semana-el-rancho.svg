<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Especial de la semana: lasaña artesanal y vino tinto</title>
  <desc id="desc">Tarjeta promocional para destacar la lasaña artesanal con copa de vino tinto del restaurante Gereni.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d140f" />
      <stop offset="100%" stop-color="#2b1d14" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c47a35" />
      <stop offset="100%" stop-color="#a35b1f" />
    </linearGradient>
    <clipPath id="card-radius">
      <rect x="80" y="80" width="1040" height="640" rx="56" ry="56" />
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="rgba(0,0,0,0.35)" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g filter="url(#shadow)" clip-path="url(#card-radius)">
    <rect x="80" y="80" width="1040" height="640" fill="url(#card)" />
    <g transform="translate(160 170)" fill="#f6efe7">
      <text font-family="'Alegreya', 'Times New Roman', serif" font-weight="700" font-size="72" letter-spacing="0.06em">ESTA SEMANA EN EL RANCHO</text>
      <text y="120" font-family="'Alegreya', 'Times New Roman', serif" font-weight="700" font-size="108">Lasaña Artesanal + Vino Tinto</text>
      <text y="210" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-weight="400" font-size="42" xml:space="preserve">Capas de pasta fresca con ragú lento de res y bechamel de romero.</text>
      <text y="270" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-weight="400" font-size="42">Incluye copa de Cabernet Sauvignon costarricense.</text>
      <text y="370" font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif" font-weight="600" font-size="48">Disponible hasta el domingo · ₡16&nbsp;500</text>
    </g>
    <g transform="translate(720 360)">
      <circle cx="0" cy="0" r="200" fill="rgba(0,0,0,0.12)" />
      <circle cx="-20" cy="-10" r="188" fill="#592b16" />
      <ellipse cx="-40" cy="90" rx="180" ry="70" fill="#f6efe7" opacity="0.85" />
      <ellipse cx="-40" cy="70" rx="150" ry="52" fill="#ede3d5" />
      <rect x="-160" y="-10" width="220" height="120" rx="20" ry="20" fill="#f1d7a3" />
      <rect x="-150" y="0" width="200" height="28" fill="#c44f2f" />
      <rect x="-150" y="36" width="200" height="28" fill="#f6c765" />
      <rect x="-150" y="72" width="200" height="28" fill="#c44f2f" />
      <rect x="-150" y="108" width="200" height="28" fill="#f6c765" />
      <rect x="-160" y="-10" width="220" height="16" rx="16" ry="16" fill="#efe0ca" />
      <g transform="translate(120 -40)">
        <path d="M 0 0 C 60 -20 100 -20 140 0 C 132 40 116 74 92 100 C 84 108 70 108 60 100 C 34 74 18 40 10 0 Z" fill="#b53d50" />
        <path d="M 64 100 L 86 100 L 92 190 L 58 190 Z" fill="#ede3d5" />
        <rect x="48" y="190" width="52" height="12" rx="6" ry="6" fill="#d2c5b6" />
      </g>
    </g>
  </g>
</svg>
