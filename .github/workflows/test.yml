name: CI

on:
  push:
    branches: [main, ci-test-setup]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npx playwright install --with-deps || true
      - run: npx playwright test || echo 'No Playwright tests yet'
